<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>바른말 고운말 모둠 채팅 - 초등 4학년 국어 수업</title>
  <style>
    :root {
      --bg-student: #f0f7ff;
      --bg-teacher: #f1f5f9;
      --card-bg: #ffffff;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-soft: #dbeafe;
      --accent: #f59e0b;
      --accent-soft: #fef3c7;
      --danger: #dc2626;
      --danger-soft: #fee2e2;
      --success: #059669;
      --text-main: #1e293b;
      --text-sub: #64748b;
      --border: #cbd5e1;
      --radius-lg: 18px;
      --radius-md: 12px;
      --radius-sm: 8px;
      --shadow: 0 4px 16px rgba(15, 23, 42, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Pretendard", "Noto Sans KR", "Malgun Gothic", -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--text-main);
      background: var(--bg-student);
      min-height: 100vh;
      line-height: 1.5;
    }

    body.teacher-mode { background: var(--bg-teacher); }
    .hidden { display: none !important; }

    /* 상단 오류 진단 배너 */
    .fatal-error-banner {
      background: #fef2f2;
      border-bottom: 3px solid #ef4444;
      color: #991b1b;
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      font-size: 14px;
      position: sticky;
      top: 0;
      z-index: 3000;
    }

    .fatal-error-banner strong { font-size: 15px; display: block; margin-bottom: 2px; }

    /* 공통 버튼 & 입력 */
    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      border-radius: var(--radius-sm);
      font-weight: 600;
      transition: all 0.15s ease;
    }

    button:disabled { opacity: 0.55; cursor: not-allowed; }

    .btn-primary { background: var(--primary); color: #fff; padding: 10px 18px; font-size: 15px; }
    .btn-primary:hover:not(:disabled) { background: var(--primary-hover); }

    .btn-secondary { background: #e2e8f0; color: var(--text-main); padding: 9px 14px; font-size: 14px; }
    .btn-secondary:hover:not(:disabled) { background: #cbd5e1; }

    .btn-danger { background: var(--danger); color: #fff; padding: 9px 14px; font-size: 14px; }
    .btn-danger:hover:not(:disabled) { background: #b91c1c; }

    .btn-success { background: var(--success); color: #fff; padding: 9px 14px; font-size: 14px; }
    .btn-success:hover:not(:disabled) { background: #047857; }

    .btn-warning { background: var(--accent); color: #fff; padding: 9px 14px; font-size: 14px; }
    .btn-warning:hover:not(:disabled) { background: #d97706; }

    .btn-xs { padding: 5px 9px; font-size: 12px; border-radius: 6px; }

    input[type="text"],
    input[type="password"],
    input[type="url"],
    select,
    textarea {
      font-family: inherit;
      border: 2px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      font-size: 15px;
      color: var(--text-main);
      background: #fff;
      width: 100%;
      outline: none;
      transition: border-color 0.15s;
    }

    input:focus, select:focus, textarea:focus { border-color: var(--primary); }

    /* ========== 1. 대기실 / 학생 입장 화면 ========== */
    .entry-wrapper { max-width: 780px; margin: 0 auto; padding: 36px 20px; }

    .entry-card {
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      padding: 32px;
      border: 2px solid #dbeafe;
    }

    .entry-header { text-align: center; margin-bottom: 24px; }

    .entry-badge {
      display: inline-block;
      background: var(--primary-soft);
      color: var(--primary);
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .entry-header h1 { font-size: 28px; color: #0f172a; margin-bottom: 8px; }
    .entry-header p { color: var(--text-sub); font-size: 15px; }

    .topic-preview-box {
      background: var(--accent-soft);
      border: 2px solid #fcd34d;
      border-radius: var(--radius-md);
      padding: 14px 18px;
      margin-bottom: 24px;
      text-align: center;
    }

    .topic-preview-label { font-size: 13px; font-weight: 700; color: #92400e; margin-bottom: 4px; }
    .topic-preview-text { font-size: 18px; font-weight: 800; color: #78350f; }

    .room-grid-select {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 22px;
    }

    @media (max-width: 600px) {
      .room-grid-select { grid-template-columns: repeat(2, 1fr); }
    }

    .room-select-btn {
      background: #f8fafc;
      border: 2px solid #cbd5e1;
      border-radius: var(--radius-md);
      padding: 16px 12px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .room-select-btn:hover { border-color: var(--primary); background: #eff6ff; }
    .room-select-btn.selected {
      border-color: var(--primary);
      background: #dbeafe;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
    }

    .room-select-title { font-size: 18px; font-weight: 800; color: #0f172a; }
    .room-select-count { font-size: 13px; color: var(--text-sub); font-weight: 600; }
    .room-select-count.full { color: var(--danger); }

    .form-group { margin-bottom: 18px; }
    .form-group label { display: block; font-weight: 700; font-size: 15px; margin-bottom: 8px; color: #1e293b; }

    .rules-mini-box {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: var(--radius-md);
      padding: 14px 16px;
      margin: 20px 0;
      font-size: 14px;
    }

    .rules-mini-title { font-weight: 700; color: #1e40af; margin-bottom: 8px; }
    .rules-tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .rule-tag {
      background: #fee2e2;
      color: #991b1b;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
    }

    .entry-footer-links {
      margin-top: 22px;
      padding-top: 16px;
      border-top: 1px solid #e2e8f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      font-size: 13px;
      color: var(--text-sub);
    }

    /* ========== 2. 학생용 채팅방 화면 ========== */
    .student-chat-layout {
      max-width: 900px;
      height: 100vh;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      background: #fff;
      box-shadow: 0 0 24px rgba(15, 23, 42, 0.08);
    }

    .chat-top-header {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #fff;
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .chat-room-info { display: flex; align-items: center; gap: 12px; }
    .chat-room-pill {
      background: rgba(255, 255, 255, 0.22);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 18px;
      font-weight: 800;
    }

    .chat-user-meta { font-size: 14px; opacity: 0.95; }
    .chat-header-right { display: flex; align-items: center; gap: 8px; }

    .status-chip {
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
    }

    .topic-banner {
      background: var(--accent-soft);
      border-bottom: 2px solid #fde68a;
      padding: 11px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 15px;
    }

    .topic-banner-tag {
      background: #f59e0b;
      color: #fff;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 12px;
      white-space: nowrap;
    }

    .topic-banner-content { font-weight: 700; color: #78350f; font-size: 16px; }

    .notice-banner {
      background: #eff6ff;
      border-bottom: 2px solid #93c5fd;
      padding: 11px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #1e3a8a;
      font-weight: 700;
      font-size: 15px;
    }

    .members-bar {
      background: #f8fafc;
      border-bottom: 1px solid #e2e8f0;
      padding: 8px 20px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      font-size: 13px;
      color: var(--text-sub);
    }

    .member-badge {
      background: #e0f2fe;
      color: #0369a1;
      padding: 3px 10px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 13px;
    }

    .member-badge.me { background: #dcfce7; color: #15803d; }

    .chat-messages-area {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      background: #f8fbff;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .chat-empty-state { margin: auto; text-align: center; color: var(--text-sub); padding: 30px; }
    .chat-empty-state p { font-size: 16px; margin-bottom: 6px; }

    .msg-row { display: flex; flex-direction: column; max-width: 78%; }
    .msg-row.mine { align-self: flex-end; align-items: flex-end; }
    .msg-row.other { align-self: flex-start; align-items: flex-start; }

    .msg-sender { font-size: 13px; font-weight: 700; color: #475569; margin-bottom: 4px; padding: 0 4px; }
    .msg-bubble-wrap { display: flex; align-items: flex-end; gap: 6px; }
    .msg-row.mine .msg-bubble-wrap { flex-direction: row-reverse; }

    .msg-bubble {
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 16px;
      line-height: 1.5;
      word-break: break-word;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.06);
    }

    .msg-row.mine .msg-bubble { background: #2563eb; color: #fff; border-bottom-right-radius: 4px; }
    .msg-row.other .msg-bubble { background: #ffffff; color: #0f172a; border: 1px solid #dbeafe; border-bottom-left-radius: 4px; }

    .msg-time { font-size: 11px; color: #94a3b8; white-space: nowrap; margin-bottom: 2px; }

    .lock-banner {
      background: #fef2f2;
      border-top: 2px solid #fca5a5;
      color: #991b1b;
      padding: 12px 20px;
      text-align: center;
      font-weight: 700;
      font-size: 15px;
    }

    .chat-input-bar { padding: 14px 18px; background: #fff; border-top: 2px solid #e2e8f0; }
    .chat-input-row { display: flex; gap: 10px; align-items: center; }
    .chat-input-row input { flex: 1; font-size: 16px; padding: 12px 16px; border-radius: 12px; }

    .chat-send-btn {
      background: var(--primary);
      color: #fff;
      padding: 12px 22px;
      font-size: 16px;
      border-radius: 12px;
      white-space: nowrap;
    }

    .chat-send-btn:hover:not(:disabled) { background: var(--primary-hover); }

    .chat-input-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 6px;
      font-size: 12px;
      color: var(--text-sub);
    }

    /* ========== 3. 교사 통합 대시보드 ========== */
    .teacher-auth-wrapper { max-width: 440px; margin: 80px auto; padding: 20px; }

    .teacher-header {
      background: #0f172a;
      color: #fff;
      padding: 14px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .teacher-title-area h1 { font-size: 20px; font-weight: 800; }
    .teacher-badges { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 4px; }

    .sys-pill { font-size: 12px; padding: 3px 10px; border-radius: 999px; font-weight: 700; }
    .sys-pill.online { background: #065f46; color: #a7f3d0; }
    .sys-pill.rest { background: #0e7490; color: #cffafe; }
    .sys-pill.demo { background: #92400e; color: #fde68a; }
    .sys-pill.ai-on { background: #1e40af; color: #bfdbfe; }
    .sys-pill.ai-off { background: #475569; color: #e2e8f0; }

    .teacher-header-actions { display: flex; gap: 8px; flex-wrap: wrap; }

    .teacher-toolbar {
      background: #fff;
      border-bottom: 1px solid #cbd5e1;
      padding: 14px 24px;
      display: grid;
      grid-template-columns: 1.2fr 1.2fr auto;
      gap: 14px;
      align-items: end;
    }

    @media (max-width: 1100px) {
      .teacher-toolbar { grid-template-columns: 1fr; }
    }

    .toolbar-block label { display: block; font-size: 12px; font-weight: 700; color: #475569; margin-bottom: 5px; }
    .inline-input-group { display: flex; gap: 6px; }
    .inline-input-group input { padding: 8px 12px; font-size: 14px; }
    .toolbar-global-btns { display: flex; gap: 8px; flex-wrap: wrap; }

    .dashboard-grid {
      padding: 20px 24px 36px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    @media (max-width: 1280px) { .dashboard-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 820px) { .dashboard-grid { grid-template-columns: 1fr; } }

    .room-monitor-card {
      background: #fff;
      border-radius: var(--radius-md);
      border: 2px solid #e2e8f0;
      box-shadow: 0 2px 10px rgba(15, 23, 42, 0.05);
      display: flex;
      flex-direction: column;
      height: 430px;
      overflow: hidden;
    }

    .room-monitor-card.locked { border-color: #f87171; }
    .room-monitor-card.alert-high { box-shadow: 0 0 0 2px rgba(245, 158, 11, 0.35); }

    .room-card-head {
      padding: 11px 14px;
      background: #f8fafc;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .room-card-title { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 16px; }
    .room-color-dot { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }
    .room-card-status { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

    .mini-pill { font-size: 12px; padding: 2px 8px; border-radius: 999px; font-weight: 700; }
    .mini-pill.count { background: #e0f2fe; color: #0369a1; }
    .mini-pill.locked { background: #fee2e2; color: #b91c1c; }
    .mini-pill.warn { background: #fef3c7; color: #92400e; cursor: pointer; }
    .mini-pill.warn-high { background: #fee2e2; color: #b91c1c; cursor: pointer; }

    .room-card-members {
      padding: 6px 14px;
      background: #ffffff;
      border-bottom: 1px solid #f1f5f9;
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
      min-height: 33px;
      align-items: center;
      font-size: 12px;
      color: var(--text-sub);
    }

    .room-card-notice {
      background: #eff6ff;
      color: #1e40af;
      padding: 5px 14px;
      font-size: 12px;
      font-weight: 700;
      border-bottom: 1px solid #bfdbfe;
    }

    .room-card-feed {
      flex: 1;
      overflow-y: auto;
      padding: 10px 14px;
      background: #fafcff;
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 13px;
    }

    .monitor-msg-item { background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; padding: 7px 10px; }
    .monitor-msg-meta { display: flex; justify-content: space-between; font-size: 11px; color: #64748b; margin-bottom: 3px; }
    .monitor-msg-sender { font-weight: 700; color: #1e293b; }
    .monitor-msg-body { color: #0f172a; word-break: break-word; }

    .room-card-actions {
      padding: 8px 10px;
      background: #f8fafc;
      border-top: 1px solid #e2e8f0;
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    /* ========== 4. 모달 ========== */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.55);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 18px;
      z-index: 1000;
    }

    .modal-box {
      background: #fff;
      border-radius: var(--radius-lg);
      max-width: 560px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 20px 50px rgba(15, 23, 42, 0.25);
      padding: 24px;
    }

    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #e2e8f0;
    }

    .modal-head h2 { font-size: 20px; color: #0f172a; }
    .modal-close-btn { background: #f1f5f9; color: #475569; width: 32px; height: 32px; border-radius: 50%; font-size: 16px; }

    .correction-box { border: 3px solid #f59e0b; }
    .correction-cats { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
    .correction-cat-badge {
      background: #fee2e2;
      color: #991b1b;
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 800;
    }

    .correction-original {
      background: #f8fafc;
      border: 1px dashed #cbd5e1;
      border-radius: 10px;
      padding: 10px 14px;
      margin-bottom: 14px;
      font-size: 14px;
      color: #64748b;
    }

    .correction-explain {
      background: #fffbeb;
      border: 1px solid #fde68a;
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 16px;
      font-size: 15px;
      color: #78350f;
      line-height: 1.6;
    }

    .correction-suggestion-card {
      background: #ecfdf5;
      border: 2px solid #34d399;
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 18px;
    }

    .correction-suggestion-label { font-size: 13px; font-weight: 800; color: #065f46; margin-bottom: 6px; }
    .correction-suggestion-text { font-size: 17px; font-weight: 700; color: #064e3b; word-break: break-word; }

    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }

    .qr-container { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 12px 0; }
    .qr-canvas-box {
      padding: 16px;
      background: #fff;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      min-width: 242px;
      min-height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #64748b;
      font-size: 13px;
    }

    .url-copy-box {
      width: 100%;
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 10px;
      font-size: 13px;
      word-break: break-all;
      color: #334155;
    }

    .settings-section {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 14px;
    }

    .settings-section h3 { font-size: 15px; margin-bottom: 8px; color: #0f172a; }
    .help-text { font-size: 12px; color: #64748b; margin-top: 6px; line-height: 1.5; }

    .toast-banner {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: #0f172a;
      color: #fff;
      padding: 12px 22px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
      z-index: 2000;
    }

    .blocked-log-item {
      border: 1px solid #fecaca;
      background: #fef2f2;
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 8px;
      font-size: 13px;
    }

    .spinner-inline {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255, 255, 255, 0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
